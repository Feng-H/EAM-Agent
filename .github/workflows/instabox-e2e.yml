name: InstaBox E2E Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fullstack-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install InstaBox CLI
        run: |
          curl -fsSL https://instabox.sh/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Quota Guard (Clean Stale CI Sandboxes)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          STALE_BOXES=$(instabox ls --json 2>/dev/null | jq -r '.[].name // empty' | grep '^eam-ci-' || true)
          for box in $STALE_BOXES; do
            echo "Reclaiming stale CI sandbox: $box"
            instabox rm "$box" --yes || true
          done

      - name: Launch Test Sandbox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          BOX_NAME="eam-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BOX_NAME=$BOX_NAME" >> $GITHUB_ENV
          instabox create --name "$BOX_NAME" --snapshot ems-demo-v2 --delete-after 15m

      - name: Run Full-Stack Health and API Verification
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          instabox exec "$BOX_NAME" -- 'cd /data/home/EMS && docker compose up -d'
          
          instabox exec "$BOX_NAME" -- '
            echo "Waiting for full stack services to initialize..."
            
            # 等待后端完成数据库握手与监听 (最多等待 60s)
            READY=0
            for i in $(seq 1 60); do
              if docker logs ems-backend 2>&1 | grep -q "Server starting on port 8080"; then
                echo "Backend Go API ready at ${i}s"
                READY=1
                break
              fi
              # 若后端因数据库启动竞争卡住，辅助轻量重启一次
              if [ $i -eq 12 ] || [ $i -eq 25 ]; then
                docker restart ems-backend >/dev/null 2>&1 || true
              fi
              sleep 1
            done

            if [ "$READY" -ne 1 ]; then
              echo "Backend failed to start within 60s"
              docker logs ems-backend --tail 30
              exit 1
            fi

            # 确保前端反代绑定到最新后端容器
            docker restart ems-frontend >/dev/null 2>&1
            sleep 3

            # 验证端到端 API 路由与数据库认证连通性
            SUCCESS=0
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"ci_probe\",\"password\":\"wrong_pass\"}" || true)
              
              if [ "$STATUS" = "401" ]; then
                echo "Full-stack API and DB authentication verified (HTTP 401)"
                SUCCESS=1
                break
              fi
              sleep 1
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "Timed out waiting for API route (last status: $STATUS)"
              docker logs ems-backend --tail 20
              exit 1
            fi
            
            curl -fsS http://localhost:3000/health
            echo "All E2E health checks passed successfully!"
          '

      - name: Teardown Sandbox
        if: always()
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          if [ -n "$BOX_NAME" ]; then
            instabox rm "$BOX_NAME" --yes || instabox rm "$BOX_NAME" || true
          fi

      - name: Notify Failure to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" -X POST -d '{
              "embeds": [{
                "title": "🚨 EAM-Agent 全栈集成测试失败",
                "color": 15158332,
                "description": "InstaBox 云端全栈沙箱自动化测试未通过，请排查原因。",
                "fields": [
                  {"name": "分支", "value": "'"${GITHUB_REF_NAME}"'", "inline": true},
                  {"name": "提交", "value": "'"${GITHUB_SHA:0:7}"'", "inline": true},
                  {"name": "触发者", "value": "'"${GITHUB_ACTOR}"'", "inline": true},
                  {"name": "Run 详情", "value": "[点击查看 GitHub Actions 完整日志]('${GITHUB_SERVER_URL}'/'${GITHUB_REPOSITORY}'/actions/runs/'${GITHUB_RUN_ID}')"}
                ],
                "footer": {"text": "可直接在 Discord 回复「自动修复 CI」让 Hermes 介入排查"}
              }]
            }' "$DISCORD_WEBHOOK_URL" || true
          fi
