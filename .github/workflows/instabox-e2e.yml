name: InstaBox E2E Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fullstack-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install InstaBox CLI
        run: |
          curl -fsSL https://instabox.sh/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Launch Test Sandbox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          BOX_NAME="eam-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BOX_NAME=$BOX_NAME" >> $GITHUB_ENV
          instabox create --name "$BOX_NAME" --snapshot ems-demo-v2 --delete-after 15m

      - name: Run Full-Stack Health and API Verification
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          instabox exec "$BOX_NAME" -- 'cd /data/home/EMS && docker compose up -d'
          
          instabox exec "$BOX_NAME" -- '
            echo "Waiting for services to initialize..."
            sleep 10
            docker restart ems-backend
            sleep 6
            docker restart ems-frontend
            
            SUCCESS=0
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/v1/auth/login \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"ci_probe\",\"password\":\"wrong_pass\"}" || true)
              
              if [ "$STATUS" = "401" ]; then
                echo "Full-stack API and DB authentication verified after ${i}s (HTTP 401)"
                SUCCESS=1
                break
              fi
              
              if [ "$STATUS" = "502" ] && [ $((i % 6)) -eq 0 ]; then
                docker restart ems-frontend >/dev/null 2>&1 || true
              fi
              sleep 1
            done
            
            if [ "$SUCCESS" -ne 1 ]; then
              echo "Timed out waiting for API (last status: $STATUS)"
              docker logs ems-backend --tail 30
              exit 1
            fi
            
            curl -fsS http://localhost:3000/health
            echo "All E2E health checks passed successfully!"
          '

      - name: Teardown Sandbox
        if: always()
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          if [ -n "$BOX_NAME" ]; then
            instabox rm "$BOX_NAME" --yes || instabox rm "$BOX_NAME" || true
          fi
